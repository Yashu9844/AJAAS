# JAAS Development Configuration
server:
  port: 8080
  env: development

database:
  host: localhost
  port: 5432
  user: postgres
  password: ""
  dbname: jaas_dev
  sslmode: disable
  auto_migrate: false # apply migrations/*.sql (set true only for a legacy AutoMigrate-created database)

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

rabbitmq:
  host: localhost
  port: 5672
  user: guest
  password: guest

jwt:
  secret: dev_secret_key_minimum_256_bits_for_security_purposes_only
  access_token_ttl: 15 # in minutes
  refresh_token_ttl: 7 # in days
  signing_key: "" # base64 Ed25519 seed (32 bytes); JWT_SIGNING_KEY. Development derives one from the secret.
  accept_legacy_hs256: true # accept HS256 tokens during the EdDSA migration window

platform:
  admin_key: dev-platform-admin-key-change-me # override with PLATFORM_ADMIN_KEY

storage:
  endpoint: http://localhost:9090 # S3-compatible server (docker compose service s3); empty for AWS S3
  region: us-east-1
  bucket: jaas-files # empty disables file attachments
  access_key: test
  secret_key: test
  path_style: true
