# JAAS Production Configuration
server:
  port: 8080
  env: production

database:
  host: db
  port: 5432
  user: postgres
  password: ""
  dbname: jaas_prod
  auto_migrate: false
  sslmode: require

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

rabbitmq:
  host: rabbitmq
  port: 5672
  user: guest
  password: guest

jwt:
  secret: "" # Must be injected via JWT_SECRET env variable in production
  access_token_ttl: 15
  refresh_token_ttl: 7
  signing_key: "" # base64 Ed25519 seed (32 bytes); JWT_SIGNING_KEY. Development derives one from the secret.
  accept_legacy_hs256: false # accept HS256 tokens during the EdDSA migration window

platform:
  admin_key: "" # Must be injected via PLATFORM_ADMIN_KEY env variable in production

storage:
  endpoint: "" # empty for AWS S3; inject STORAGE_ENDPOINT for another S3-compatible service
  region: ""
  bucket: "" # inject STORAGE_BUCKET; empty disables file attachments
  access_key: "" # inject STORAGE_ACCESS_KEY
  secret_key: "" # inject STORAGE_SECRET_KEY
  path_style: false

projects:
  secrets_key: "" # base64 32-byte key for webhook/integration secrets; REQUIRED, inject PROJECTS_SECRETS_KEY
