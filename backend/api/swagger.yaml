            available_after: {$ref: '#/components/schemas/Days'}
            working_dates: {type: array, items: {type: string, format: date}}
    Money:
      type: number
      description: Rupees with at most 2 decimals (stored exactly as paise); percentages use the same format (40.00 = 40%)
      example: 41666.67
    ComponentRequest:
      type: object
      required: [code, name, kind, calc]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_]{2,20}$', description: Upper-cased; exactly one BASIC}
        name: {type: string, maxLength: 100}
        kind: {type: string, enum: [earning, deduction]}
        calc: {type: string, enum: [fixed, percent_of_ctc, percent_of_basic, balance]}
        value: {$ref: '#/components/schemas/Money'}
        taxable: {type: boolean, default: true}
    CreateStructureRequest:
      type: object
      required: [name, components]
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 500}
        pf_enabled: {type: boolean, default: true}
        esi_enabled: {type: boolean, default: true}
        pt_enabled: {type: boolean, default: true}
        tds_enabled: {type: boolean, default: true}
        components: {type: array, minItems: 1, maxItems: 40, items: {$ref: '#/components/schemas/ComponentRequest'}}
    UpdateStructureRequest:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        pf_enabled: {type: boolean}
        esi_enabled: {type: boolean}
        pt_enabled: {type: boolean}
        tds_enabled: {type: boolean}
    Structure:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        pf_enabled: {type: boolean}
        esi_enabled: {type: boolean}
        pt_enabled: {type: boolean}
        tds_enabled: {type: boolean}
        status: {type: string, enum: [active, inactive]}
