        warnings: {type: array, items: {type: string}, description: 'e.g. STRUCTURE_OVERFLOW:<code>, NET_CAPPED:<code>, EMPLOYEE_MISSING:<id>'}
        calculated_by_user_id: {type: string, format: uuid}
        approved_by_user_id: {type: string, format: uuid}
        calculated_at: {type: string, format: date-time}
