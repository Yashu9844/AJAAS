openapi: 3.0.3
info:
  title: JAAS Modules 0-2 API (Identity, Organization, Employee)
  description: API specifications for Module 0 — Tenant, Identity, and RBAC authorization core.
  version: 1.1.0
  x-conventions: |
    Errors always use {"error": {"code": "...", "message": "...", "details": [{"field","message"}]}}.
    Lists return {"data": [...], "meta": {"page","per_page","total_items","total_pages"}}; per_page is clamped to 1..100
    (default 20) and junk values fall back to the defaults.
    Granting access is non-escalating: a caller who is not tenant_admin can only assign roles / attach permissions
    made of permissions they hold themselves; assigning tenant_admin requires tenant_admin (403 otherwise).
    PII (statutory data) is masked unless ?unmasked=true is requested AND the caller holds employee:read_sensitive (403 otherwise).
servers:
  - url: http://localhost:8080/api/v1
    description: Local Dev Server
paths:
  /auth/login:
    post:
      summary: User Login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - tenant_slug
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                tenant_slug:
                  type: string
      responses:
        '200':
          description: Successful Login
        '401':
          description: Invalid Credentials
        '403':
          description: Tenant Suspended or User Account Inactive

  /auth/logout:
    post:
      summary: User Logout
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      responses:
        '200':
          description: Successfully Logged Out
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      summary: Token Refresh Rotation
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token rotated successfully
        '401':
          description: Refresh token expired or reuse breach detected

  /auth/forgot-password:
    post:
      summary: Request Password Reset Token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - tenant_slug
              properties:
                email:
                  type: string
                  format: email
                tenant_slug:
                  type: string
      responses:
        '200':
          description: Silently reports success to avoid email leakage

  /auth/reset-password:
    post:
      summary: Reset Password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
                - confirm_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                confirm_password:
                  type: string
      responses:
        '200':
          description: Password updated

  /tenants:
    post:
      security:
        - PlatformKey: []
      summary: Create Tenant (platform operator key required)
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
                plan:
                  type: string
                admin:
                  type: object
                  description: Optional first tenant_admin, created atomically with the tenant.
                  required: [email, password, first_name, last_name]
                  properties:
                    email: {type: string, format: email}
                    password: {type: string, minLength: 8, maxLength: 72}
                    first_name: {type: string}
                    last_name: {type: string}
      responses:
        '201':
          description: Tenant created (admin_user_id is returned when an admin was provisioned)
        '401':
          description: Missing X-Platform-Key
        '403':
          description: Wrong X-Platform-Key
        '503':
          description: Platform administration is not configured (PLATFORM_ADMIN_KEY unset)
    get:
      security:
        - PlatformKey: []
      summary: List Tenants
      tags:
        - Tenants
      responses:
        '200':
          description: Paginated tenant list

  /tenants/{id}:
    get:
      security:
        - PlatformKey: []
      summary: Get Tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
    patch:
      security:
        - PlatformKey: []
      summary: Update Tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                domain:
                  type: string
                plan:
                  type: string
      responses:
        '200':
          description: Tenant updated

  /tenants/{id}/activate:
    post:
      security:
        - PlatformKey: []
      summary: Activate Tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant status set to active

  /tenants/{id}/suspend:
    post:
      security:
        - PlatformKey: []
      summary: Suspend Tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant status set to suspended

  /users:
    post:
      summary: Create User
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
                - last_name
              properties:
                email:
                  type: string
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                role_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: User created
    get:
      summary: List Tenant Users
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      responses:
        '200':
          description: List of users in tenant

  /users/{id}:
    get:
      summary: Get User Profile
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
    patch:
      summary: Update User
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          description: User updated

  /users/{id}/deactivate:
    post:
      summary: Deactivate User Account
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User set to inactive

  /users/{id}/roles:
    post:
      summary: Assign Roles to User
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_ids
              properties:
                role_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: User roles assigned successfully

  /roles:
    post:
      summary: Create Custom Role
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                permission_ids:
                  type: array
                  description: Granted at tenant scope (legacy form).
                  items:
                    type: string
                    format: uuid
                grants:
                  type: array
                  items:
                    $ref: '#/components/schemas/GrantInput'
                parent_role_id:
                  type: string
                  format: uuid
                  description: The role inherits every grant of its parent (same tenant, acyclic, depth at most 10). The caller must hold everything the parent grants.
      responses:
        '201':
          description: Role created
        '403':
          description: A grant or the parent reaches further than the caller's own access
        '409':
          description: Name taken or inheritance cycle
    get:
      summary: List Tenant Roles
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      responses:
        '200':
          description: List of roles

  /roles/{id}:
    get:
      summary: Get Role
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role details
    patch:
      summary: Update Role
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Role updated
    delete:
      summary: Delete Custom Role
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role soft deleted

  /roles/{id}/permissions:
    post:
      summary: Assign Permissions to Role
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of permission_ids or grants. Re-granting a held permission changes its scope.
              properties:
                permission_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                grants:
                  type: array
                  items:
                    $ref: '#/components/schemas/GrantInput'
      responses:
        '200':
          description: Permissions assigned to role (a predefined role stops being template-managed)

  /roles/{id}/clone:
    post:
      summary: Clone a role (grants, scopes and parent) into a new custom role
      tags: [Roles]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, maxLength: 100}}}
      responses:
        '201': {description: Role created}
        '403': {description: 'System roles cannot be cloned, or the copy reaches further than the caller access'}

  /auth/me/access:
    get:
      summary: Explain the caller's effective access (scope and source of every permission)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      responses:
        '200': {description: Explained access, content: {application/json: {schema: {$ref: '#/components/schemas/ExplainAccess'}}}}

  /users/{id}/access:
    get:
      summary: Explain a user's effective access (access:read)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Explained access, content: {application/json: {schema: {$ref: '#/components/schemas/ExplainAccess'}}}}
        '404': {description: Unknown user in this tenant}

  /users/{id}/grants:
    get:
      summary: List a user's individual grants (access:read)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Grants (expired ones flagged)}
    post:
      summary: Grant one permission to one user at a scope, optionally until expires_at (access:manage)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserGrantRequest'}}}
      responses:
        '201': {description: Granted (replaces an existing grant of the same permission)}
        '400': {description: Invalid scope or expires_at not in the future}
        '403': {description: Wider than the caller's own access}

  /users/{id}/grants/{permission_id}:
    delete:
      summary: Revoke an individual grant (access:manage)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {name: permission_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Revoked}
        '404': {description: No such grant}

  /users/{id}/blocks:
    get:
      summary: List a user's blocks (access:read)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Blocks}
    post:
      summary: Block one permission for one user; a block always wins over roles and grants (access:manage)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserBlockRequest'}}}
      responses:
        '201': {description: Blocked}
        '409': {description: tenant_admin holders cannot be blocked}

  /users/{id}/blocks/{permission_id}:
    delete:
      summary: Lift a block (access:manage)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}, {name: permission_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Unblocked}
        '404': {description: No such block}

  /invitations:
    post:
      summary: Invite a user (account created as invited; single-use token sent through the secret channel) (users:create)
      tags: [Invitations]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, first_name, last_name]
              properties:
                email: {type: string, format: email}
                first_name: {type: string}
                last_name: {type: string}
                role_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '201': {description: 'Invited user and pending invitation (expires in 7 days)'}
        '403': {description: A role reaches further than the inviter's access}
        '409': {description: Email already used in the tenant}
    get:
      summary: List invitations; status=pending for open ones (users:read)
      tags: [Invitations]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{name: status, in: query, schema: {type: string, enum: [pending]}}]
      responses:
        '200': {description: 'Invitations with status pending, accepted, revoked or expired'}

  /invitations/{id}/resend:
    post:
      summary: Issue a fresh token and revoke the previous one (users:create)
      tags: [Invitations]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: New pending invitation}
        '409': {description: Already accepted, or the user is no longer invited}

  /invitations/{id}/revoke:
    post:
      summary: Revoke an open invitation (users:update)
      tags: [Invitations]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Revoked}

  /auth/accept-invitation:
    post:
      summary: Accept an invitation with its token and set the password (public, failure rate limited)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirm_password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 8, maxLength: 72}
                confirm_password: {type: string}
      responses:
        '200': {description: Account activated; the user can sign in}
        '400': {description: 'INVALID_TOKEN: unknown, used, revoked or expired'}

  /dev/mailbox:
    get:
      summary: Development and test only - one-time secrets (reset and invitation tokens) sent to an address
      tags: [Development]
      security: [{PlatformKey: []}]
      parameters:
        - {name: tenant_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: email, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Messages, newest first}

  /access/automatic-roles/sync:
    post:
      summary: Reconcile the tenant's automatic Employee and Manager roles from HR data now (access:manage)
      tags: [Access]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      responses:
        '200': {description: 'Counts: added, removed'}

  /auth/me:
    get:
      summary: Roles and effective permissions of the caller
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: "{user_id, roles[], permissions[] (resource:action), is_tenant_admin}"
        '401':
          description: Missing / invalid / revoked token
  /users/{id}/activate:
    post:
      summary: Re-activate a deactivated user (users:update)
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Activated user (with roles)
        '404':
          description: Unknown user
        '409':
          description: User is already active
  /users/{id}/roles/{role_id}:
    delete:
      summary: Remove a role from a user (users:update; the last tenant_admin cannot be removed)
      tags:
        - Users
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: role_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Role removed
        '404':
          description: User/role unknown or role not assigned
        '409':
          description: Would remove the last tenant_admin
  /roles/{id}/permissions/{permission_id}:
    delete:
      summary: Remove a permission from a role (roles:update)
      tags:
        - Roles
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: permission_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Permission removed
        '403':
          description: tenant_admin permissions are fixed
        '404':
          description: Unknown role or permission not assigned
  /audit-logs:
    get:
      summary: Read the tenant audit trail, newest first (audit:read)
      tags:
        - Audit
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Paginated audit records
  /permissions:
    get:
      summary: List Global Permissions
      tags:
        - Permissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of global privileges

  /hr/departments:
    post:
      summary: Create Department
      tags:
        - Departments
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                code:
                  type: string
                description:
                  type: string
                parent_department_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Department created
        '409':
          description: Department name/code conflict or cycle detected
    get:
      summary: List Departments
      tags:
        - Departments
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: parent_id
          in: query
          schema:
            type: string
            format: uuid
        - name: root_only
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated department list

  /hr/departments/{id}:
    get:
      summary: Get Department
      tags:
        - Departments
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Department details
        '404':
          description: Department not found
    patch:
      summary: Update Department
      tags:
        - Departments
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                parent_department_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Department updated
        '409':
          description: Cycle detected or name conflict

  /hr/departments/{id}/deactivate:
    post:
      summary: Deactivate Department
      tags:
        - Departments
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Department deactivated
        '409':
          description: Department has active teams/mappings without force=true

  /hr/teams:
    post:
      summary: Create Team
      tags:
        - Teams
      security:
        - BearerAuth: []
        - TenantSubdomain: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - department_id
              properties:
                name:
                  type: string
                department_id:
                  type: string
                  format: uuid
                code:
                  type: string
                description:
                  type: string
                lead_user_id:
                  type: string
                  format: uuid
      responses:
        '201':
