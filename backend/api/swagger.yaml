        '200': {description: Payslips, content: {application/json: {schema: {$ref: '#/components/schemas/PayslipListEnvelope'}}}}
  /payroll/runs/{id}/payout.csv:
    get:
      summary: Payout export employee_code,employee_name,net_pay — finalized only (payroll:read)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: CSV file, content: {text/csv: {schema: {type: string}}}}
        '409': {description: RUN_STATE}
  /payroll/payslips/{id}:
    get:
      summary: Any payslip (payroll:read)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Payslip, content: {application/json: {schema: {$ref: '#/components/schemas/PayslipEnvelope'}}}}
        '404': {description: NOT_FOUND}
  /payroll/payslips/me:
    get:
      summary: Caller's payslips of finalized runs (self)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
      responses:
        '200': {description: Own payslips, content: {application/json: {schema: {$ref: '#/components/schemas/PayslipListEnvelope'}}}}
  /payroll/payslips/me/{id}:
    get:
