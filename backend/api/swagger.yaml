    UpdateLeaveTypeRequest:
      type: object
      description: All optional; code immutable; max_consecutive_days 0 clears the limit
      properties:
        name: {type: string}
        is_paid: {type: boolean}
        annual_allowance: {$ref: '#/components/schemas/Days'}
        accrual: {type: string, enum: [annual, monthly]}
        carry_forward_limit: {$ref: '#/components/schemas/Days'}
        max_consecutive_days: {type: integer, minimum: 0, maximum: 365}
        min_notice_days: {type: integer}
        allow_half_day: {type: boolean}
        sandwich_rule: {type: boolean}
        applicable_gender: {type: string, enum: [all, male, female]}
    LeaveType:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        is_paid: {type: boolean}
        annual_allowance: {$ref: '#/components/schemas/Days'}
        accrual: {type: string}
        carry_forward_limit: {$ref: '#/components/schemas/Days'}
        max_consecutive_days: {type: integer}
        min_notice_days: {type: integer}
        allow_half_day: {type: boolean}
        sandwich_rule: {type: boolean}
        applicable_gender: {type: string}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
