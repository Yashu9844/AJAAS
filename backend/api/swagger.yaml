        '404': {description: NOT_FOUND}
  /payroll/runs/{id}/calculate:
    post:
      summary: Calculate or recalculate payslips (payroll:manage)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Calculated, content: {application/json: {schema: {$ref: '#/components/schemas/RunEnvelope'}}}}
        '409': {description: RUN_STATE}
  /payroll/runs/{id}/approve:
    post:
      summary: Approve a calculated run; approver must differ from the calculator (payroll:approve)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/RunEnvelope'}}}}
        '403': {description: SELF_APPROVAL_FORBIDDEN | FORBIDDEN}
        '409': {description: RUN_STATE}
  /payroll/runs/{id}/finalize:
    post:
      summary: Finalize an approved run; payslips become visible (payroll:approve)
      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Finalized, content: {application/json: {schema: {$ref: '#/components/schemas/RunEnvelope'}}}}
        '409': {description: RUN_STATE}
  /payroll/runs/{id}/payslips:
    get:
