        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {description: Paginated requests, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestListEnvelope'}}}}

  /leave/requests/me:
    get:
      summary: Caller's own requests (self)
      tags: [Leave]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, cancelled]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200': {description: Paginated requests, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestListEnvelope'}}}}

  /leave/requests/{id}:
    get:
      summary: Get a request (leave:read)
      tags: [Leave]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Request, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}}}}
        '404': {description: NOT_FOUND}

  /leave/requests/{id}/cancel:
    post:
      summary: Cancel own request (self, LV-011)
      tags: [Leave]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}}}}
        '404': {description: NOT_FOUND (not yours)}
        '409': {description: LEAVE_ALREADY_STARTED | LEAVE_NOT_CANCELLABLE}

  /leave/requests/{id}/approve:
    post:
      summary: Approve (leave:approve; marks attendance on_leave)
      tags: [Leave]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ReviewRequest'}}}}
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}}}}
        '403': {description: SELF_APPROVAL_FORBIDDEN | FORBIDDEN}
        '409': {description: LEAVE_NOT_PENDING}

  /leave/requests/{id}/reject:
    post:
      summary: Reject with a comment (leave:approve)
      tags: [Leave]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewRequest'}}}}
      responses:
        '200': {description: Rejected, content: {application/json: {schema: {$ref: '#/components/schemas/LeaveRequestEnvelope'}}}}
        '400': {description: VALIDATION_ERROR (comment required)}
        '403': {description: SELF_APPROVAL_FORBIDDEN | FORBIDDEN}
        '409': {description: LEAVE_NOT_PENDING}


