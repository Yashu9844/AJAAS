        effective_to: {type: string, format: date}
        created_at: {type: string, format: date-time}
    AssignmentEnvelopeP: {type: object, properties: {data: {$ref: '#/components/schemas/PayrollAssignment'}}}
    AssignmentListEnvelopeP: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PayrollAssignment'}}, meta: {$ref: '#/components/schemas/PageMeta'}}}
