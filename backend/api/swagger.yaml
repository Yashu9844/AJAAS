      tags: [Payroll]
      security: [{BearerAuth: []}, {TenantSubdomain: []}]
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses:
        '200': {description: Payslip, content: {application/json: {schema: {$ref: '#/components/schemas/PayslipEnvelope'}}}}
        '404': {description: NOT_FOUND}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your user access token.
    PlatformKey:
      type: apiKey
      in: header
      name: X-Platform-Key
      description: Platform operator key (PLATFORM_ADMIN_KEY) guarding /tenants routes. Fails closed when unset.
    TenantSubdomain:
      type: apiKey
      in: header
      name: Host
      description: The request host header containing the tenant subdomain slug (e.g. acme.jaas.com).
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}, description: Invalid values clamp to 1}
    PerPage: {name: per_page, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}, description: Invalid values clamp to 20; above 100 clamps to 100}
    FromDate: {name: from, in: query, schema: {type: string, format: date}}
    ToDate: {name: to, in: query, schema: {type: string, format: date}}
    RegStatus: {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, cancelled]}}
  responses:
    ValidationError:
      description: VALIDATION_ERROR with field details
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object, properties: {field: {type: string}, message: {type: string}}}}
    PageMeta:
      type: object
      properties: {page: {type: integer}, per_page: {type: integer}, total_items: {type: integer}, total_pages: {type: integer}}
    PunchRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [in, out]}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        device_id: {type: string, maxLength: 100}
        source: {type: string, enum: [web, mobile], default: web}
    Punch:
      type: object
      description: IP address is stored for audit but never returned
      properties:
        id: {type: string, format: uuid}
        punch_type: {type: string, enum: [in, out]}
        punch_time: {type: string, format: date-time}
        source: {type: string, enum: [web, mobile, regularization]}
        latitude: {type: number}
        longitude: {type: number}
        device_id: {type: string}
        is_superseded: {type: boolean}
    Record:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        attendance_date: {type: string, format: date}
        shift_id: {type: string, format: uuid}
        first_punch_in: {type: string, format: date-time}
        last_punch_out: {type: string, format: date-time}
        total_work_minutes: {type: integer}
        total_break_minutes: {type: integer}
        late_minutes: {type: integer}
        overtime_minutes: {type: integer}
        status: {type: string, enum: [present, half_day, absent, on_leave, holiday, week_off]}
        source: {type: string}
        is_regularized: {type: boolean}
        updated_at: {type: string, format: date-time}
    PunchResultEnvelope:
      type: object
      properties: {data: {type: object, properties: {punch: {$ref: '#/components/schemas/Punch'}, record: {$ref: '#/components/schemas/Record'}}}}
    TodayEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            attendance_date: {type: string, format: date}
            record: {$ref: '#/components/schemas/Record'}
            open_session: {type: boolean}
            shift: {$ref: '#/components/schemas/Shift'}
    RecordListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Record'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    RecordDetailEnvelope:
      type: object
      properties: {data: {type: object, properties: {record: {$ref: '#/components/schemas/Record'}, punches: {type: array, items: {$ref: '#/components/schemas/Punch'}}}}}
    SummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            date: {type: string, format: date}
            total_employees: {type: integer}
            present: {type: integer}
            late: {type: integer}
            half_day: {type: integer}
            on_leave: {type: integer}
            absent: {type: integer}
    CreateRegularizationRequest:
      type: object
      required: [attendance_date, requested_punch_in, requested_punch_out, reason]
      properties:
        attendance_date: {type: string, format: date}
        requested_punch_in: {type: string, format: date-time}
        requested_punch_out: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 500}
    ReviewRequest:
      type: object
      properties: {comment: {type: string, minLength: 1, maxLength: 500, description: Required for reject}}
    Regularization:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        attendance_date: {type: string, format: date}
        requested_punch_in: {type: string, format: date-time}
        requested_punch_out: {type: string, format: date-time}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, rejected, cancelled]}
        reviewer_user_id: {type: string, format: uuid}
        reviewed_at: {type: string, format: date-time}
        review_comment: {type: string}
        created_at: {type: string, format: date-time}
    RegularizationEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Regularization'}}
    RegularizationListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Regularization'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    CreateShiftRequest:
      type: object
      required: [name, start_time, end_time]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        code: {type: string, pattern: '^[a-z0-9-]{2,32}$'}
        start_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00'}
        end_time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '18:00'}
        grace_period_mins: {type: integer, minimum: 0, maximum: 240, default: 15}
        break_duration_mins: {type: integer, minimum: 0, maximum: 480, default: 60}
        full_day_minutes: {type: integer, minimum: 1, maximum: 1440}
        half_day_minutes: {type: integer, minimum: 1, maximum: 1440}
        timezone: {type: string, example: Asia/Kolkata, default: UTC}
    UpdateShiftRequest:
      type: object
      description: All fields optional; code is immutable
      properties:
        name: {type: string}
        start_time: {type: string}
        end_time: {type: string}
        grace_period_mins: {type: integer}
        break_duration_mins: {type: integer}
        full_day_minutes: {type: integer}
        half_day_minutes: {type: integer}
        timezone: {type: string}
    Shift:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        start_time: {type: string}
        end_time: {type: string}
        grace_period_mins: {type: integer}
        break_duration_mins: {type: integer}
        full_day_minutes: {type: integer}
        half_day_minutes: {type: integer}
        timezone: {type: string}
        is_night_shift: {type: boolean}
        expected_minutes: {type: integer}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ShiftEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Shift'}}
    ShiftListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Shift'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    AssignShiftRequest:
      type: object
      required: [employee_id, effective_from]
      properties:
        employee_id: {type: string, format: uuid}
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date}
    Assignment:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date}
        created_at: {type: string, format: date-time}
    AssignmentEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Assignment'}}
    AssignmentListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Assignment'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    Days:
      type: number
      description: Leave days with at most 2 decimals (stored exactly as hundredths)
      example: 1.5
    CreateLeaveTypeRequest:
      type: object
      required: [name, code]
      properties:
        name: {type: string, maxLength: 100}
        code: {type: string, pattern: '^[A-Za-z0-9_]{2,10}$', description: Upper-cased; immutable}
        is_paid: {type: boolean, default: true}
        annual_allowance: {$ref: '#/components/schemas/Days'}
        accrual: {type: string, enum: [annual, monthly], default: annual}
        carry_forward_limit: {$ref: '#/components/schemas/Days'}
        max_consecutive_days: {type: integer, minimum: 1, maximum: 365}
        min_notice_days: {type: integer, minimum: 0, maximum: 90}
        allow_half_day: {type: boolean, default: true}
        sandwich_rule: {type: boolean, default: false}
        applicable_gender: {type: string, enum: [all, male, female], default: all}
    UpdateLeaveTypeRequest:
      type: object
      description: All optional; code immutable; max_consecutive_days 0 clears the limit
      properties:
        name: {type: string}
        is_paid: {type: boolean}
        annual_allowance: {$ref: '#/components/schemas/Days'}
        accrual: {type: string, enum: [annual, monthly]}
        carry_forward_limit: {$ref: '#/components/schemas/Days'}
        max_consecutive_days: {type: integer, minimum: 0, maximum: 365}
        min_notice_days: {type: integer}
        allow_half_day: {type: boolean}
        sandwich_rule: {type: boolean}
        applicable_gender: {type: string, enum: [all, male, female]}
    LeaveType:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        is_paid: {type: boolean}
        annual_allowance: {$ref: '#/components/schemas/Days'}
        accrual: {type: string}
        carry_forward_limit: {$ref: '#/components/schemas/Days'}
        max_consecutive_days: {type: integer}
        min_notice_days: {type: integer}
        allow_half_day: {type: boolean}
        sandwich_rule: {type: boolean}
        applicable_gender: {type: string}
        status: {type: string, enum: [active, inactive]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LeaveTypeEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/LeaveType'}}
    LeaveTypeListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/LeaveType'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    CreateHolidayRequest:
      type: object
      required: [date, name]
      properties:
        date: {type: string, format: date}
        name: {type: string, maxLength: 100}
        is_optional: {type: boolean, default: false}
    Holiday:
      type: object
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        name: {type: string}
        is_optional: {type: boolean}
        created_at: {type: string, format: date-time}
    HolidayEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Holiday'}}
    HolidayListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Holiday'}}}
    AdjustBalanceRequest:
      type: object
      required: [employee_id, leave_type_id, days, reason]
      properties:
        employee_id: {type: string, format: uuid}
