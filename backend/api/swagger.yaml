        gross: {$ref: '#/components/schemas/Money'}
        deductions: {$ref: '#/components/schemas/Money'}
        net: {$ref: '#/components/schemas/Money'}
    BreakdownEnvelope: {type: object, properties: {data: {$ref: '#/components/schemas/Breakdown'}}}
    MyAssignmentEnvelope: {type: object, properties: {data: {type: object, properties: {assignment: {$ref: '#/components/schemas/PayrollAssignment'}, breakdown: {$ref: '#/components/schemas/Breakdown'}}}}}
    CreateRunRequest:
      type: object
      required: [month, year]
      properties:
        month: {type: integer, minimum: 1, maximum: 12}
        year: {type: integer, minimum: 2000, maximum: 2200}
    Run:
      type: object
      properties:
        id: {type: string, format: uuid}
        month: {type: integer}
        year: {type: integer}
        status: {type: string, enum: [draft, calculated, approved, finalized]}
        employee_count: {type: integer}
        gross_total: {$ref: '#/components/schemas/Money'}
        deduction_total: {$ref: '#/components/schemas/Money'}
