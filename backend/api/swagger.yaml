components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your user access token.
    PlatformKey:
      type: apiKey
      in: header
      name: X-Platform-Key
      description: Platform operator key (PLATFORM_ADMIN_KEY) guarding /tenants routes. Fails closed when unset.
    TenantSubdomain:
      type: apiKey
      in: header
      name: Host
      description: The request host header containing the tenant subdomain slug (e.g. acme.jaas.com).
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 255}, description: 'Accepted on every POST/PUT/PATCH/DELETE. Same key + same request replays the stored outcome (Idempotent-Replayed: true); same key + different request is 409 IDEMPOTENCY_KEY_REUSED; while the first is running 409 IDEMPOTENCY_IN_PROGRESS. Keys live 24 h.'}
    CorrelationID: {name: X-Correlation-ID, in: header, required: false, schema: {type: string, format: uuid}, description: Echoed back and stored on audit rows and events; invalid values are replaced}
    Page: {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}, description: Invalid values clamp to 1}
    PerPage: {name: per_page, in: query, schema: {type: integer, default: 20, minimum: 1, maximum: 100}, description: Invalid values clamp to 20; above 100 clamps to 100}
    FromDate: {name: from, in: query, schema: {type: string, format: date}}
    ToDate: {name: to, in: query, schema: {type: string, format: date}}
    RegStatus: {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, cancelled]}}
  responses:
    ValidationError:
      description: VALIDATION_ERROR with field details
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    GrantInput:
      type: object
      required: [permission_id]
      properties:
        permission_id: {type: string, format: uuid}
        scope: {type: string, enum: [own, direct_reports, all_reports, department, tenant], default: tenant}
    UserGrantRequest:
      type: object
      required: [permission_id]
      properties:
        permission_id: {type: string, format: uuid}
        scope: {type: string, enum: [own, direct_reports, all_reports, department, tenant], default: tenant}
        expires_at: {type: string, format: date-time}
        reason: {type: string, maxLength: 500}
    UserBlockRequest:
      type: object
      required: [permission_id]
      properties:
        permission_id: {type: string, format: uuid}
        reason: {type: string, maxLength: 500}
    ExplainAccess:
      type: object
      properties:
        data:
          type: object
          properties:
            user_id: {type: string, format: uuid}
            is_tenant_admin: {type: boolean}
            roles: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, source: {type: string, enum: [manual, automatic]}}}}
            permissions:
              type: array
              items:
                type: object
                properties:
                  permission: {type: string, example: 'leave:approve'}
                  module: {type: string}
                  sensitive: {type: boolean}
                  scope: {type: string}
                  blocked: {type: boolean}
                  sources:
                    type: array
                    items: {type: object, properties: {kind: {type: string, enum: [role, automatic_role, inherited, user_grant]}, role_id: {type: string}, role_name: {type: string}, scope: {type: string}}}
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object, properties: {field: {type: string}, message: {type: string}}}}
    PageMeta:
      type: object
      properties: {page: {type: integer}, per_page: {type: integer}, total_items: {type: integer}, total_pages: {type: integer}}
    PunchRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [in, out]}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        device_id: {type: string, maxLength: 100}
        source: {type: string, enum: [web, mobile], default: web}
    Punch:
      type: object
      description: IP address is stored for audit but never returned
      properties:
        id: {type: string, format: uuid}
        punch_type: {type: string, enum: [in, out]}
        punch_time: {type: string, format: date-time}
        source: {type: string, enum: [web, mobile, regularization]}
        latitude: {type: number}
        longitude: {type: number}
        device_id: {type: string}
        is_superseded: {type: boolean}
    Record:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        attendance_date: {type: string, format: date}
        shift_id: {type: string, format: uuid}
        first_punch_in: {type: string, format: date-time}
        last_punch_out: {type: string, format: date-time}
        total_work_minutes: {type: integer}
        total_break_minutes: {type: integer}
        late_minutes: {type: integer}
        overtime_minutes: {type: integer}
        status: {type: string, enum: [present, half_day, absent, on_leave, holiday, week_off]}
        source: {type: string}
        is_regularized: {type: boolean}
        updated_at: {type: string, format: date-time}
    PunchResultEnvelope:
      type: object
      properties: {data: {type: object, properties: {punch: {$ref: '#/components/schemas/Punch'}, record: {$ref: '#/components/schemas/Record'}}}}
    TodayEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            attendance_date: {type: string, format: date}
            record: {$ref: '#/components/schemas/Record'}
            open_session: {type: boolean}
            shift: {$ref: '#/components/schemas/Shift'}
    RecordListEnvelope:
      type: object
      properties: {data: {type: array, items: {$ref: '#/components/schemas/Record'}}, meta: {$ref: '#/components/schemas/PageMeta'}}
    RecordDetailEnvelope:
      type: object
      properties: {data: {type: object, properties: {record: {$ref: '#/components/schemas/Record'}, punches: {type: array, items: {$ref: '#/components/schemas/Punch'}}}}}
    SummaryEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            date: {type: string, format: date}
            total_employees: {type: integer}
            present: {type: integer}
            late: {type: integer}
            half_day: {type: integer}
            on_leave: {type: integer}
            absent: {type: integer}
    CreateRegularizationRequest:
      type: object
      required: [attendance_date, requested_punch_in, requested_punch_out, reason]
      properties:
        attendance_date: {type: string, format: date}
        requested_punch_in: {type: string, format: date-time}
        requested_punch_out: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 500}
    ReviewRequest:
      type: object
      properties: {comment: {type: string, minLength: 1, maxLength: 500, description: Required for reject}}
    Regularization:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_id: {type: string, format: uuid}
        attendance_date: {type: string, format: date}
        requested_punch_in: {type: string, format: date-time}
        requested_punch_out: {type: string, format: date-time}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, rejected, cancelled]}
        reviewer_user_id: {type: string, format: uuid}
        reviewed_at: {type: string, format: date-time}
        review_comment: {type: string}
        created_at: {type: string, format: date-time}
    RegularizationEnvelope:
      type: object
      properties: {data: {$ref: '#/components/schemas/Regularization'}}
    RegularizationListEnvelope:
      type: object
